<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/orange.png" alt="" width="24" height="24">
    <h1>Opened Link Highlighter</h1>
  </header>

  <section class="card">
    <!-- Whether newly opened links are saved -->
    <label class="row">
      <span class="row-text">
        <span class="row-title">Track Opened Links</span>
        <span class="row-hint">Save the links you open</span>
      </span>
      <input type="checkbox" class="switch" id="toggle">
    </label>

    <!-- Whether saved links are highlighted on pages -->
    <label class="row">
      <span class="row-text">
        <span class="row-title">Show Highlights</span>
        <span class="row-hint">Highlight saved links on pages</span>
      </span>
      <input type="checkbox" class="switch" id="show-highlights">
    </label>
  </section>

  <!-- Clear saved links, with a confirmation step -->
  <section class="card">
    <button type="button" class="row expander" id="clear" aria-expanded="false" aria-controls="clear-panel">
      <span class="row-title">Clear Highlights</span>
      <span class="count" id="link-count">0</span>
      <span class="chevron"></span>
    </button>
    <div class="collapsible" id="clear-panel">
      <div class="collapsible-inner">
        <div class="panel confirm">
          <button type="button" class="danger" id="clear-confirm">Are you sure?</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Customize Highlights -->
  <section class="card">
    <button type="button" class="row expander" aria-expanded="false" aria-controls="colors-panel">
      <span class="row-title">Customize Highlights</span>
      <span class="chevron"></span>
    </button>

    <div class="collapsible" id="colors-panel">
      <div class="collapsible-inner">
        <div class="panel colors">
          <!-- One example for light pages, one for dark pages -->
          <div class="previews">
            <div class="preview preview-plain"><span class="color-preview">Example link</span></div>
            <div class="preview preview-dark"><span class="color-preview">Example link</span></div>
          </div>

          <!-- Swatches are added by popup.js, before the box that previews the chosen color -->
          <div class="field">
            <span class="field-label">Inner Highlight</span>
            <div class="swatches" id="highlight-swatches">
              <span class="chosen-color" id="highlight-chosen" title="Chosen color and opacity"></span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="highlight-opacity">Inner Highlight Opacity <span id="highlight-opacity-value"></span></label>
            <input type="range" id="highlight-opacity" min="0.1" max="1" step="0.05">
          </div>

          <div class="field">
            <span class="field-label">Outline</span>
            <div class="swatches" id="outline-swatches">
              <span class="chosen-color" id="outline-chosen" title="Chosen color and opacity"></span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="outline-opacity">Outline Opacity <span id="outline-opacity-value"></span></label>
            <input type="range" id="outline-opacity" min="0" max="1" step="0.05">
          </div>

          <button type="button" class="secondary" id="reset-colors">Reset to Default</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Advanced Options -->
  <section class="card">
    <button type="button" class="row expander" aria-expanded="false" aria-controls="advanced-panel">
      <span class="row-title">Advanced Options</span>
      <span class="chevron"></span>
    </button>

    <div class="collapsible" id="advanced-panel">
      <div class="collapsible-inner">
        <div class="panel">
      <!-- Query Parameters toggle -->
      <label class="row">
        <span class="row-text">
          <span class="row-title">Normalize Query Parameters</span>
          <span class="row-hint">Ignore everything after "?"</span>
        </span>
        <input type="checkbox" class="switch" id="normalize-query">
      </label>

      <!-- Hash Fragments toggle -->
      <label class="row">
        <span class="row-text">
          <span class="row-title">Normalize Hash Fragments</span>
          <span class="row-hint">Ignore everything after "#"</span>
        </span>
        <input type="checkbox" class="switch" id="normalize-hash">
      </label>

        </div>
      </div>
    </div>
  </section>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
